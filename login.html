<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Sistema de Monitoramento de Plantas</title>
  <meta name="description" content="Acesse sua conta para visualizar o monitoramento em tempo real." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="btn btn-ghost">← Voltar</a>
      <div class="brand" style="color:#fff;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/></svg>
        <strong>Monitoramento de Plantas</strong>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1 id="auth-title">Entrar</h1>
      <p class="lead">Acesse o painel de monitoramento em tempo real.</p>

      <button id="google-btn" class="google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16.1 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 36 44 30.5 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Continuar com Google
      </button>

      <div class="divider">ou</div>

      <form id="email-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required placeholder="voce@email.com" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" minlength="6" required placeholder="••••••••" />
        </div>
        <div id="error-box" class="error-box hidden"></div>
        <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="switch-mode">
        <span id="switch-label">Não tem conta?</span>
        <button id="switch-btn" type="button">Cadastre-se</button>
      </p>
    </div>
  </main>

  <script type="module" src="firebase-auth.js"></script>
</body>
</html>
